  else         {gOn=15.35;gOff=15.55;}
  var gv=B.finestra(t,gOn,gOff,0.4,0.3);
  var dx=B.lerp(26,0,B.ep(t,gOn,gOn+1.0)),dy=B.lerp(-18,0,B.ep(t,gOn,gOn+1.0));
  S.ghost.sposta(CX+dx,CY+dy);B.op(S.ghost.dentro,gv*0.9);B.op(S.gEti.dentro,gv);

  // deviatore, scivolo, vaschetta
  S.scivolo.mostra(t,12.0,15.8,{dy:0});S.vasca.mostra(t,12.0,15.8,{dy:0});S.dev.mostra(t,12.6,15.3,{dy:0});
  S.braccio.setAttribute('transform',B.tr(0,0,1,phi));

  // card A (pezzo conforme)
  S.cA.mostra(t,3.0,4.5);
  S.barA.imposta(0.18*B.ep(t,3.3,3.9));
  B.op(S.esA,B.finestra(t,3.9,4.5));
  S.kA.disegna(B.ep(t,3.1,3.6)*(1-B.pr(t,4.5,4.8)));
  // card B (pezzo con difetto)
  S.cB.mostra(t,7.2,12.0);
  S.barB.imposta(0.8*B.ep(t,7.8,9.0));
  B.op(S.esB,B.finestra(t,8.9,12.0));
  S.kB.disegna(B.ep(t,7.3,7.9)*(1-B.pr(t,12.0,12.4)));
}
BA.avvia(CONFIG,prepara,scena);
</script>
