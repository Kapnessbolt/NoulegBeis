  [[0,0.95],[0.5,0.45],[1,0]].forEach(function(s){el('stop',{offset:s[0],'stop-color':C.corallo,'stop-opacity':s[1]},cr);});
  el('rect',{width:W,height:H,fill:'url(#ba-bg)'},$('fondo'));
  el('rect',{width:W,height:H,fill:'url(#ba-grid)'},$('fondo'));}

function intestazione(){
  R.lbl=etichetta($('testa'),CFG.etichetta||'',{x:MX,y:110,'font-size':22,'letter-spacing':5,'data-ba':'etichetta'});
  R.ttl=testo($('testa'),CFG.titolo||'',{x:MX,y:160,'font-size':44,'data-ba':'titolo'});}

function statiTracker(n,fasi){
  return fasi.map(function(f){var s=[];for(var i=1;i<=n;i++){
    var v=0;
    if(f[1]==='attivo')v=i<f[2]?2:i===f[2]?1:0;
    else if(f[1]==='fatto')v=i<=f[2]?2:0;
    else if(f[1]==='tutti')v=2;
    s.push(v);}return {t:f[0],s:s};});}

function tracker(){
  var passi=CFG.passi||[];if(!passi.length)return;
  var o=CFG.tracker||{},g=$('trk'),passo=o.passo||95;
  g.setAttribute('transform',tr(o.x||MX,o.y||250));
  var fasi=(CFG.fasi||[]).slice().sort(function(a,b){return a[0]-b[0];});
  if(!fasi.length||fasi[0][0]>0)fasi.unshift([0,'reset']);
  if(!fasi.some(function(f){return f[1]==='tutti';})&&CFG.riepilogo)fasi.push([CFG.riepilogo.da+0.35,'tutti']);
  R.fasi=statiTracker(passi.length,fasi);
  el('line',{x1:22,y1:22,x2:22,y2:(passi.length-1)*passo+22,stroke:C.teal,'stroke-opacity':0.25,'stroke-width':3},g);
  R.passi=passi.map(function(nome,i){
    var r=el('g',{transform:tr(0,i*passo)},g);
    var idle=el('g',{},r);el('circle',{cx:22,cy:22,r:21,fill:C.fondo2,stroke:C.teal,'stroke-width':2.5},idle);
    testo(idle,String(i+1),{x:22,y:30,fill:C.teal,'font-size':22,'text-anchor':'middle'});
    var act=el('g',{},r);var halo=el('circle',{cx:22,cy:22,r:30,fill:C.blu,opacity:0.25},act);
    el('circle',{cx:22,cy:22,r:22,fill:C.blu},act);testo(act,String(i+1),{x:22,y:30,'font-size':22,'text-anchor':'middle'});
    var done=el('g',{},r);icona(done,'spunta',22,22,22,C.teal);
    var lab=testo(r,(i<9?'0':'')+(i+1),{x:64,y:18,'font-size':20,'letter-spacing':3});
    var ttl=testo(r,nome,{x:64,y:52,'font-size':28});
    return {idle:idle,act:act,done:done,halo:halo,lab:lab,ttl:ttl};});}

function pesiPasso(i,t){
  var F=R.fasi,k=0;for(var j=0;j<F.length;j++){if(t>=F[j].t)k=j;}
  var st=F[k].s[i],prev=k>0?F[k-1].s[i]:st,u=k>0?eio(pr(t,F[k].t,F[k].t+0.2)):1;
  var w=[0,0,0];w[prev]+=1-u;w[st]+=u;return w;}

function contatori(){
  var o=CFG.contatori;if(!o)return;var g=$('cnt'),lw=o.larghezza||250;
  g.setAttribute('transform',tr(o.x||MX,o.y||900));
  R.cnt=o.voci.map(function(v,i){
    var col=TIPI[v.colore]||v.colore||C.teal;var base=col===C.corallo?0.6:0.3;
    var gg=el('g',{transform:tr(i*(lw+24),0)},g);
    var rect=el('rect',{width:lw,height:104,rx:16,fill:C.navy,stroke:col,'stroke-opacity':base,'stroke-width':2},gg);
    etichetta(gg,v.nome,{x:28,y:38,fill:col,'letter-spacing':3});
    var num=testo(gg,'',{'font-size':48});
    var cambi=v.valori.slice(1).map(function(k){return k[0];});
    return {v:v,col:col,base:base,rect:rect,num:num,cambi:cambi};});}

function riepilogo(){
  var o=CFG.riepilogo;if(!o)return;
  var n=o.righe.length,h=58+(n-1)*48+34,w=o.w||840;
  var x=o.x==null?W-MX-w:o.x,y=o.y==null?1000-h:o.y;
  R.rcX=x;R.rcY=y;
  el('rect',{width:w,height:h,rx:16,fill:C.navy,'fill-opacity':0.97,stroke:C.teal,'stroke-opacity':0.5,'stroke-width':2},$('recap'));
  R.rc=lista($('recap'),o.righe,{x:30,y:58});}

function disclaimer(){
  R.foot=testo($('foot'),CFG.disclaimer||'Illustrazione BlueAge · animazione didattica, non è un prodotto',
    {x:W-MX,y:1042,'text-anchor':'end','font-size':18,'font-weight':400,'fill-opacity':0.45,'data-ba':'disclaimer'});}

function renderBase(t){
  var u=ep(t,0.05,0.7);op(R.lbl,u);R.lbl.setAttribute('transform',tr(0,(1-u)*10));
  u=ep(t,0.2,0.9);op(R.ttl,u);R.ttl.setAttribute('transform',tr(0,(1-u)*10));
  op($('trk'),ep(t,0.7,1.3));op($('cnt'),ep(t,0.5,1.1));op(R.foot,ep(t,1.0,1.5));
  if(R.passi)R.passi.forEach(function(r,i){
    var w=pesiPasso(i,t);
    op(r.idle,w[0]*0.5);op(r.act,w[1]);op(r.done,w[2]);
    r.halo.setAttribute('r',n2(28+3*Math.sin(t*6)));
    op(r.ttl,0.45*w[0]+w[1]+0.85*w[2]);
    r.lab.setAttribute('fill',mix(C.teal,C.blu,w[1]));op(r.lab,0.6*w[0]+w[1]+w[2]);});
  if(R.cnt)R.cnt.forEach(function(c){
    var pulse=0;c.cambi.forEach(function(tc){pulse=Math.max(pulse,bump(t,tc,tc+0.7));});
    c.num.textContent=String(scalino(t,c.v.valori));
    c.num.setAttribute('transform','translate(28 88) scale('+n2(1+0.1*pulse)+')');
    c.num.setAttribute('fill',mix(C.bianco,c.col,pulse));
    c.rect.setAttribute('stroke-opacity',n2(c.base+0.55*pulse));});
  var o=CFG.riepilogo;
  if(o){
    var rd=ep(t,o.da,o.da+0.6),att=o.attenua==null?1:o.attenua;
    op($('scena'),lerp(1,att,rd));op($('hud'),lerp(1,att,rd));
    var ru=ep(t,o.da+0.1,o.da+0.6);op($('recap'),ru);$('recap').setAttribute('transform',tr(R.rcX,R.rcY+(1-ru)*16));
    R.rc.forEach(function(p,i){var q=ep(t,o.da+0.3+i*0.3,o.da+0.7+i*0.3);op(p.dentro,q);p.dentro.setAttribute('transform',tr((1-q)*18,0));});
  }}

function velo(t){var d=CFG.durata;op($('veil'),Math.max(1-eout(pr(t,0,0.35)),pr(t,d-0.3,d)));}

function avvia(cfg,prepara,scena){
  CFG=cfg;CFG.durata=CFG.durata||18;CFG.fps=CFG.fps||30;
  if(CFG.riepilogo&&CFG.riepilogo.da==null)CFG.riepilogo.da=CFG.durata-2;
  var d=CFG.durata;
  window.BA_INFO={nome:CFG.nome||'',durata:d,fps:CFG.fps,poster:CFG.poster==null?d-0.5:CFG.poster,
    fotogrammi:CFG.fotogrammi||[1,3.5,8,10,13.5,d-0.5],tipo:'animazione',lib:'BA_ANIM_LIB v1'};
  if(CFG.titolo)document.title='Animazione BlueAge · '+CFG.titolo;
  var font=(document.fonts&&document.fonts.load)?Promise.all(['400 20px','500 20px','700 28px'].map(function(f){return document.fonts.load(f+' "Plus Jakarta Sans"');})).then(function(){return document.fonts.ready;}):Promise.resolve();
  window.animReady=font.then(function(){
    sfondo();intestazione();tracker();contatori();riepilogo();disclaimer();
    var A={scena:$('scena'),hud:$('hud'),defs:$('defs'),C:C,durata:d};
    prepara(A);
    window.renderAt=function(t){t=clamp(t,0,d);renderBase(t);scena(t,A);velo(t);};
    anteprima();return true;});}

function anteprima(){
  var h=location.hash||'';
  if(/render/.test(h)){window.renderAt(0);return;}
  var m=h.match(/t=([\d.]+)/),d=CFG.durata,pausa=!!m,ora=m?parseFloat(m[1]):0,ult=null;
  var lab=document.createElement('div');lab.id='ba-ora';document.body.appendChild(lab);
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){pausa=!pausa;e.preventDefault();}
    if(e.code==='ArrowRight'){ora=Math.min(d,ora+0.5);pausa=true;}
    if(e.code==='ArrowLeft'){ora=Math.max(0,ora-0.5);pausa=true;}});
  document.addEventListener('click',function(){pausa=!pausa;});
  (function loop(ts){
    if(ult!==null&&!pausa)ora=(ora+(ts-ult)/1000)%d;ult=ts;
    window.renderAt(ora);lab.textContent=ora.toFixed(1)+' s'+(pausa?' · pausa (spazio, frecce)':'');
    requestAnimationFrame(loop);})(performance.now());}

window.BA={C:C,W:W,H:H,MX:MX,clamp:clamp,lerp:lerp,eio:eio,eout:eout,ein:ein,pr:pr,ep:ep,bump:bump,finestra:finestra,
  chiavi:chiavi,scalino:scalino,mix:mix,tr:tr,casuale:casuale,$:$,el:el,set:set,op:op,testo:testo,etichetta:etichetta,
  larghezza:larghezza,gruppo:gruppo,icona:icona,pillola:pillola,card:card,righe:righe,barraSoglia:barraSoglia,
  scansione:scansione,mirino:mirino,nastro:nastro,connettore:connettore,digita:digita,documento:documento,lista:lista,avvia:avvia};
})();
/* ===== FINE BA_ANIM_LIB ===== */
</script>

<script>
/* ===== ANIMAZIONE · da qui in giù si scrive =====
   1. CONFIG: testi fissi, passi, fasi del tracker, contatori, riepilogo.
   2. prepara(A): costruisce una volta gli oggetti della scena (in A.scena, sopra la scena in A.hud).
   3. scena(t, A): aggiorna gli oggetti per l'istante t (secondi). Solo funzioni di t: niente casuale, niente orologio.
   L'esempio sotto (un documento controllato in 3 passi, 12 s) mostra i componenti principali: sostituirlo. */
var CONFIG={
  nome:'esempio',
  durata:12,
  etichetta:'ESEMPIO · TEMPLATE BLUEAGE',
  titolo:'Un documento controllato in tre passi',
  passi:['Riceve il documento','Estrae i campi','Controlla e decide'],
  fasi:[[1.0,'attivo',1],[3.0,'attivo',2],[6.0,'attivo',3],[9.0,'fatto',3]],
  contatori:{voci:[
    {nome:'CONTROLLATI',colore:'ok',valori:[[0,41],[9.0,42]]},
    {nome:'DA VERIFICARE',colore:'scarto',valori:[[0,3],[9.0,4]]}]},
  riepilogo:{righe:['Legge il documento e ne estrae i campi',{testo:'Un campo fuori regola va a una persona',icona:'attenzione'}],w:760},
  fotogrammi:[1.5,4,7,8.5,9.5,11.5]
};

var S={};
function prepara(A){
  var B=BA;
  S.doc=B.documento(A.scena,{x:760,y:240,w:460,h:540,titolo:'Ordine n. 1234'});
  S.r1=S.doc.riga(150,'Cliente:','Alfa S.r.l.');
  S.r2=S.doc.riga(200,'Prezzo:','2,10 €');
  S.doc.linee(270,6,34);
  S.panel=B.card(A.scena,{x:1300,y:240,w:524,h:300,etichetta:'CAMPI ESTRATTI'});
  S.righe=B.righe(S.panel.corpo,{x:28,y:4,w:468,icone:true,righe:[['CLIENTE','Alfa S.r.l.'],['PREZZO','2,10 €']]});
  S.ic=[S.righe[0].icona('spunta',B.C.teal),S.righe[1].icona('croce',B.C.corallo)];
  S.k1=B.connettore(A.scena,{da:[1210,382],a:[1318,368],curva:true});
  S.k2=B.connettore(A.scena,{da:[1210,432],a:[1318,432],curva:true});
  S.scan=B.scansione(A.scena,{x:760,y:300,w:460,h:470});
  S.motivo=B.testo(A.hud,'Prezzo diverso dal listino',{x:1328,y:600,fill:B.C.corallo});
  S.pill=B.pillola(A.hud,'DA VERIFICARE','scarto',{x:990,y:830});
}
function scena(t,A){
  var B=BA;
  S.doc.mostra(t,1.0,null,{dy:30});
  S.scan.passa(t,1.6,2.8);
  B.op(S.r1.box,B.finestra(t,3.2,6.0));B.op(S.r2.box,B.finestra(t,4.0,6.0));
  S.panel.mostra(t,3.0);
  S.k1.disegna(B.ep(t,3.4,4.0));S.k2.disegna(B.ep(t,4.2,4.8));
  S.righe[0].mostra(t,4.0,null,{dy:0,dx:-12});S.righe[1].mostra(t,4.8,null,{dy:0,dx:-12});
  B.op(S.ic[0],B.finestra(t,6.4));B.op(S.ic[1],B.finestra(t,7.2));
  B.op(S.righe[1].sfondo,B.finestra(t,7.2));
  B.op(S.motivo,B.finestra(t,7.6));
  S.pill.mostra(t,8.4,null,{dy:0,scala:0.8});
}
BA.avvia(CONFIG,prepara,scena);
</script>
